<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>My-Study — твой учебный день</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css?v=2.1"><link rel="stylesheet" href="/static/assistant.css?v=1"><link rel="stylesheet" href="/static/habits.css?v=1"><link rel="stylesheet" href="/static/themes.css?v=profile-fix"><link rel="stylesheet" href="/static/telegram-app.css?v=1"><link rel="stylesheet" href="/static/whiteboard.css?v=7-large-world"><link rel="stylesheet" href="/static/motion.css?v=1"><link rel="stylesheet" href="/static/planet-menu.css?v=1"><link rel="stylesheet" href="/static/island-layout.css?v=1"><link rel="stylesheet" href="/static/space-experience.css?v=1"></head>
<body><div class="space-bg"><div class="nebula n1"></div><div class="nebula n2"></div><div class="stars" id="stars"></div></div>
<div id="auth" class="auth-wrap hidden"><div class="auth-visual" aria-hidden="true"><img src="/static/bot_images/my-study.jpg" alt=""><div class="auth-visual-copy"><span class="eyebrow">МАЛЕНЬКИЕ ШАГИ. БОЛЬШИЕ ПЛАНЫ.</span><h2>Твой день.<br>В твоём ритме.</h2><p>Учёба, привычки и время для себя — в одном пространстве.</p></div></div><div class="auth-card glass"><div class="brand big"><span class="brand-mark">✦</span><span>My-Study</span></div><p class="muted">Твоё пространство для учёбы и целей</p><div class="auth-tabs"><button class="tab active" data-auth="login">Войти</button><button class="tab" data-auth="register">Создать аккаунт</button></div><form id="loginForm" class="auth-form"><label>Email или логин<input name="login" autocomplete="username" required placeholder="student@example.com"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required placeholder="Не менее 8 символов"></label><button class="primary full">Войти в My-Study <span>→</span></button></form><form id="registerForm" class="auth-form hidden"><label>Имя<input name="display_name" placeholder="Как тебя называть?"></label><label>Логин<input name="username" required minlength="3" maxlength="40" placeholder="student_01"></label><label>Email<input name="email" type="email" required placeholder="student@example.com"></label><label>Пароль<input name="password" type="password" required minlength="8" placeholder="Минимум 8 символов"></label><button class="primary full">Создать аккаунт <span>→</span></button></form><div class="auth-extra-actions"><button type="button" class="secondary full" id="telegramLoginButton">Войти через Telegram</button><button type="button" class="ghost full" id="forgotPasswordButton">Забыли пароль?</button></div><div id="authError" class="error-line"></div><div class="auth-foot">Твои данные принадлежат только тебе.</div></div></div>
<div id="app" class="app-shell hidden">
<main class="main"><header class="topbar"><div class="island-page-heading"><button type="button" class="ghost back-to-main hidden" id="backToMain">← Главное меню</button><div class="island-heading-row"><span id="sectionEmblem" class="section-emblem" aria-hidden="true"></span><div><div class="eyebrow" id="todayLabel">ТВОЁ ПРОСТРАНСТВО</div><h1 id="pageTitle">Мой космос</h1></div></div></div><div class="top-actions"><button class="quick-add-button" id="quickAdd" title="Быстро добавить">＋ <span>Добавить</span></button><button class="icon-btn" id="themeHint" title="Настроить оформление">✦</button></div></header><section id="content" class="content"></section><button id="assistantLauncher" class="assistant-launcher" aria-label="Открыть помощника">✦ <span>Помощник</span></button><footer class="footer">MY-STUDY <span>·</span> Сделай сегодняшний день значимым.</footer></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="modal" class="modal-wrap hidden"><div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h3 id="modalTitle">Добавить</h3><button class="icon-btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/static/telegram-app.js?v=1"></script><script src="/static/themes.js?v=2"></script><script src="/static/habits-core.js?v=1"></script><script src="/static/habits.js?v=3-fast-checks"></script><script src="/static/assistant.js?v=3-full-solutions"></script><script src="/static/whiteboard.js?v=7-large-world"></script><script src="/static/quick-updates.js?v=3-space"></script><script src="/static/motivation.js?v=1"></script><script src="/static/space-effects.js?v=1"></script><script src="/static/planet-menu.js?v=3-scatter"></script><script src="/static/app.js?v=space-experience"></script><script src="/static/telegram-auth.js?v=1"></script></body></html>
