name: My-Study checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node --check static/assistant.js
      - run: node --check static/habits.js
      - run: node --check static/themes.js
      - run: node --test tests/habits-core.test.cjs
      - run: node --check static/whiteboard.js
      - run: node --test tests/whiteboard.test.cjs
      - run: node --check static/quick-updates.js
      - run: node --test tests/quick-updates.test.cjs
      - run: node --check static/planet-menu.js
      - run: node --test tests/planet-menu.test.cjs
