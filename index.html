<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070910"><title>My-Study — личное пространство</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="space-bg"><div class="nebula n1"></div><div class="nebula n2"></div><div class="stars" id="stars"></div></div>
<div id="auth" class="auth-wrap hidden"><div class="auth-card glass"><div class="brand big"><span class="brand-mark">✦</span><span>My-Study</span><sup>2.0</sup></div><p class="muted">Твоё пространство для учёбы и целей</p><div class="auth-tabs"><button class="tab active" data-auth="login">Войти</button><button class="tab" data-auth="register">Создать аккаунт</button></div><form id="loginForm" class="auth-form"><label>Email или логин<input name="login" autocomplete="username" required placeholder="student@example.com"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required placeholder="Не менее 8 символов"></label><button class="primary full">Войти в My-Study <span>→</span></button></form><form id="registerForm" class="auth-form hidden"><label>Имя<input name="display_name" placeholder="Как тебя называть?"></label><label>Логин<input name="username" required minlength="3" maxlength="40" placeholder="student_01"></label><label>Email<input name="email" type="email" required placeholder="student@example.com"></label><label>Пароль<input name="password" type="password" required minlength="8" placeholder="Минимум 8 символов"></label><button class="primary full">Создать аккаунт <span>→</span></button></form><div id="authError" class="error-line"></div><div class="auth-foot">Твои данные принадлежат только тебе.</div></div></div>
<div id="app" class="app-shell hidden"><aside class="sidebar glass"><div class="brand"><span class="brand-mark">✦</span><span>My-Study</span><sup>2.0</sup></div><div class="side-caption">WORKSPACE</div><nav id="nav"><button class="nav-item active" data-page="home"><i>◈</i>Обзор</button><button class="nav-item" data-page="calendar"><i>▦</i>Календарь</button><button class="nav-item" data-page="habits"><i>✓</i>Привычки</button><button class="nav-item" data-page="tasks"><i>▤</i>Домашка</button><button class="nav-item" data-page="schedule"><i>▦</i>Расписание</button><button class="nav-item" data-page="grades"><i>✧</i>Оценки</button><button class="nav-item" data-page="cheats"><i>▧</i>Шпаргалки</button><button class="nav-item" data-page="cards"><i>▣</i>Карточки</button><button class="nav-item" data-page="goals"><i>◎</i>Цели</button><button class="nav-item" data-page="pomodoro"><i>◷</i>Pomodoro</button><button class="nav-item" data-page="analytics"><i>⌁</i>Аналитика</button><button class="nav-item" data-page="telegram"><i>➤</i>Telegram</button><button class="nav-item" data-page="search"><i>⌕</i>Поиск</button><button class="nav-item" data-page="subjects"><i>◉</i>Предметы и заметки</button><button class="nav-item" data-page="developer"><i>✦</i>Разработчик</button><button class="nav-item" data-page="settings"><i>⚙</i>Настройки</button></nav><div class="sidebar-bottom"><div class="user-mini"><div class="avatar" id="avatar">S</div><div class="user-meta"><b id="sideName">Ученик</b><small id="sideEmail">Личный аккаунт</small></div><button id="logout" class="icon-btn" title="Выйти">↗</button></div><div class="version">MY-STUDY 2.0 <span>● ONLINE</span></div></div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow" id="todayLabel">ТВОЁ ПРОСТРАНСТВО</div><h1 id="pageTitle">Мой день</h1></div><div class="top-actions"><button class="icon-btn" id="quickAdd" title="Быстро добавить">＋</button><button class="icon-btn" id="themeHint" title="Deep Space">✦</button><div class="top-avatar" id="topAvatar">S</div></div></header><section id="content" class="content"></section><footer class="footer">MY-STUDY <span>·</span> Сделай сегодняшний день значимым.</footer></main></div><div id="toast" class="toast"></div><div id="modal" class="modal-wrap hidden"><div class="modal glass"><div class="modal-head"><h3 id="modalTitle">Добавить</h3><button class="icon-btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script src="/static/app.js"></script></body></html>
